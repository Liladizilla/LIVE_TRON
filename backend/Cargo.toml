[package]
name = "live-tron-api"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
dotenvy = "0.15"
axum = { version = "0.8", features = ["json", "ws"] }
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
futures-util = "0.3"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "live-tron-api"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"
