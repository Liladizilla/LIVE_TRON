openapi: 3.1.0
info:
  title: LIVE_TRON API
  version: 0.3.0
  description: Account and creator API foundation. JSON request bodies are limited to 64 KiB. Access tokens use the live-tron-api issuer and live-tron-web audience. Media ingest and playback are not implemented.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            display_name: { type: string }
            avatar_url: { type: [string, "null"] }
      required: [access_token, token_type, expires_in, refresh_token, user]
paths:
  /healthz:
    get:
      summary: Process liveness
      responses:
        "200": { description: API process is running }
  /readyz:
    get:
      summary: Dependency readiness
      responses:
        "200": { description: PostgreSQL is reachable }
        "503": { description: PostgreSQL is not configured or unavailable }
  /v1:
    get:
      summary: API capability metadata
      responses:
        "200": { description: API metadata; media plane is not connected }
  /v1/auth/register:
    post:
      summary: Register account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128, description: "12 to 128 UTF-8 bytes; never trimmed." }
                display_name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        "201": { description: Account created and tokens issued }
        "409": { description: Email already registered }
  /v1/auth/login:
    post:
      summary: Authenticate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: Tokens issued }
        "401": { description: Invalid credentials }
  /v1/auth/refresh:
    post:
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: New access and refresh tokens }
        "401": { description: Invalid or expired refresh token }
  /v1/auth/logout:
    post:
      summary: Revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Token revoked }
  /v1/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read current account
      responses:
        "200": { description: Account profile }
        "401": { description: Missing or invalid access token }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update current display name
      responses:
        "200": { description: Updated profile }
  /v1/channels:
    get:
      summary: Discover channels
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 80 }
        - in: query
          name: category
          schema: { type: string, enum: [gaming, music, talk, education, sports, irl, commerce] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
      responses:
        "200": { description: Channel collection }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create channel for current user
      responses:
        "201": { description: Channel created }
        "409": { description: Channel slug already exists }
  /v1/channels/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: Public channel details
      responses:
        "200": { description: Channel details }
        "404": { description: Channel not found }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update channel owned by current user
      responses:
        "200": { description: Updated channel }
        "404": { description: Channel not found or not owned by caller }
  /v1/channels/{slug}/follow:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string }
    post:
      security: [{ bearerAuth: [] }]
      summary: Follow channel
      responses:
        "204": { description: Follow created or already existed }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Unfollow channel
      responses:
        "204": { description: Follow removed or did not exist }
  /v1/channels/{slug}/streams:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a stream and issue a one-time publishing key
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "201": { description: Stream created with one-time plaintext publishing key }
        "404": { description: Channel not found or not owned by caller }
  /v1/streams:
    get:
      summary: Discover public live streams
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 80 }
        - in: query
          name: category
          schema: { type: string, enum: [gaming, music, talk, education, sports, irl, commerce] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
      responses:
        "200": { description: Live public non-mature streams }
  /internal/v1/media/events:
    post:
      summary: Trusted MediaMTX online/offline lifecycle callback
      description: Private media-network endpoint authenticated by X-Live-Tron-Media-Secret. Event IDs are idempotent; only created-to-live and live-to-ended transitions are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, stream_id, event_type]
              properties:
                event_id: { type: string, format: uuid }
                stream_id: { type: string, format: uuid }
                event_type: { type: string, enum: [ingest_started, ingest_ended] }
      responses:
        "204": { description: Event applied or duplicate event already applied }
        "401": { description: Missing or invalid media event secret }
        "409": { description: Event ID reused or invalid lifecycle transition }
        "503": { description: Media event secret or database unavailable }
  /internal/v1/media/authorize:
    post:
      summary: Private MediaMTX HTTP authentication callback
      description: Must be reachable only over a private network shared with MediaMTX. Allows publishing with an active one-time publishing key and reading only public, non-mature streams already marked live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, path]
              properties:
                action: { type: string, enum: [publish, read] }
                path: { type: string, format: uuid }
                token: { type: string, description: Publishing key for publish; ignored for public read authorization }
                protocol: { type: string }
      responses:
        "200": { description: Media action authorized }
        "401": { description: Invalid key, stream path, state, or visibility }
        "503": { description: Database unavailable }
  /v1/media/ice-config:
    get:
      security: [{ bearerAuth: [] }]
      summary: Return STUN servers and short-lived coturn REST credentials for the current account
      responses:
        "200": { description: ICE server configuration; TURN credentials expire after one hour }
        "401": { description: Missing or invalid access token }
  /v1/streams/{stream_id}/signal-ticket:
    post:
      summary: Create a one-use 60-second WebSocket ticket after bearer or publishing-key authentication
      parameters:
        - in: path
          name: stream_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: One-time ticket and browser WebSocket subprotocol list }
        "401": { description: Invalid account token or publishing key }
        "409": { description: Viewer cannot join before stream is live }
  /v1/streams/{stream_id}/signal:
    get:
      summary: Upgrade to authenticated WebSocket signaling for one live stream
      description: Requires a one-use ticket in the Sec-WebSocket-Protocol header, created by the signal-ticket endpoint. Relays targeted offer, answer, and ICE messages only; it does not forward media.
      parameters:
        - in: path
          name: stream_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "101": { description: WebSocket protocol live-tron.signal.v1 established }
        "401": { description: Invalid account token or publishing key }
        "403": { description: Browser Origin is not allowlisted }
        "409": { description: Stream is not live or a publisher is already connected }
  /v1/streams/{stream_id}:
    parameters:
      - in: path
        name: stream_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read stream metadata; private streams are owner-only
      responses:
        "200": { description: Stream metadata }
        "404": { description: Stream not found }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update stream title, category, or visibility
      responses:
        "200": { description: Updated stream }
        "404": { description: Stream not found or not owned by caller }
  /v1/streams/{stream_id}/publishing-key/rotate:
    post:
      security: [{ bearerAuth: [] }]
      summary: Rotate publishing key; prior key is revoked
      responses:
        "200": { description: New one-time publishing key }
  /v1/streams/{stream_id}/publishing-key:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Revoke active publishing key
      responses:
        "204": { description: Active key revoked }
  /internal/v1/streams/{stream_id}/authorize-publish:
    post:
      summary: Validate a publishing key for an internal media gateway
      parameters:
        - in: path
          name: stream_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publishing_key]
              properties:
                publishing_key: { type: string }
      responses:
        "200": { description: Active key authorized }
        "401": { description: Invalid or revoked key }
  /internal/v1/media/events:
    post:
      summary: Trusted internal ingest lifecycle callback
      parameters:
        - in: header
          name: X-Live-Tron-Media-Secret
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, stream_id, event_type]
              properties:
                event_id: { type: string, format: uuid }
                stream_id: { type: string, format: uuid }
                event_type: { type: string, enum: [ingest_started, ingest_ended] }
      responses:
        "204": { description: Event applied or identical duplicate ignored }
        "401": { description: Invalid internal secret }
        "409": { description: Invalid state transition or reused event ID }
        "503": { description: Media event secret is not configured }
  /v1/creators/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: Public creator profile and channels
      responses:
        "200": { description: Creator profile }
        "404": { description: Creator not found }
