name: LIVE_TRON CI

on:
  push:
    branches: [main, develop, 'feat/**', 'test/**']
  # Run checks for every PR target. Feature branches may target fix/* branches
  # while dependent work is still under review (for example PR #17 -> PR #16).
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build
        run: npm run build

  media-config:
    name: MediaMTX configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate pinned MediaMTX configuration
        run: |
          docker run --rm \
            -v "$PWD/deploy/mediamtx:/etc/mediamtx:ro" \
            bluenviron/mediamtx:1.21.3 \
            --validate-conf=/etc/mediamtx/mediamtx.yml
      - name: Validate MediaMTX lifecycle hook shell syntax
        run: sh -n deploy/mediamtx/live-tron-media-event.sh
      - name: Test MediaMTX lifecycle hook payloads
        run: sh deploy/mediamtx/test-media-event-hook.sh

  api:
    name: Rust API and database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: live_tron
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: live_tron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U live_tron -d live_tron"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://live_tron:ci-password@localhost:5432/live_tron
      RUSTFLAGS: -D warnings
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run API tests
        run: cargo test --all-targets
      - name: Apply database migrations
        run: cargo run --bin migrate
