name: LIVE_TRON CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build
        run: npm run build

  api:
    name: Rust API and database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: live_tron
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: live_tron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U live_tron -d live_tron"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://live_tron:ci-password@localhost:5432/live_tron
      RUSTFLAGS: -D warnings
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Apply Rust formatting
        run: cargo fmt --all
      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style(api): apply rustfmt'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run API tests
        run: cargo test --all-targets
      - name: Apply database migrations
        run: cargo run --bin migrate
