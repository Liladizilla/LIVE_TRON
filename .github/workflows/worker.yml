name: Worker CI

on:
  pull_request:
    paths:
      - "worker/**"
  push:
    branches: [main]
    paths:
      - "worker/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
