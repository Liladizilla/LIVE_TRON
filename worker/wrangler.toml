name = "live-tron-api"
main = "src/index.ts"
compatibility_date = "2026-11-02"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "https://live-tron.pages.dev"

[[hyperdrive]]
binding = "DB"
id = "REPLACE_WITH_HYPERDRIVE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "live-tron-media"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
